  <rect x="240" width="116" height="27" rx="13.5" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".22"/>
  <text x="257" y="18" fill="#6EE7B7" font-family="Arial" font-size="11" font-weight="700">MEASURE</text>
</g>

<g transform="translate(814 62)">
