<text x="68" y="225" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">AI Agents  ·  Full-Stack Systems  ·  Workflow Automation</text>
<text x="68" y="267" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">I build the complete system between an unclear problem</text>
<text x="68" y="293" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">and a reliable, measurable business outcome.</text>
