<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400">
    <stop stop-color="#070912"/><stop offset=".52" stop-color="#11172A"/><stop offset="1" stop-color="#061A1B"/>
  </linearGradient>
  <linearGradient id="accent" x1="70" y1="0" x2="780" y2="0">
    <stop stop-color="#8B5CF6"><animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#8B5CF6" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset=".5" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#34D399;#22D3EE" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#34D399"><animate attributeName="stop-color" values="#34D399;#8B5CF6;#34D399" dur="7s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="g1"><stop stop-color="#8B5CF6" stop-opacity=".24"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .pulse2 { animation: pulse 2.8s ease-in-out .9s infinite; transform-origin: center; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .signal { stroke-dasharray: 10 18; animation: flow 2.4s linear infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes flow { to { stroke-dashoffset:-56 } }
  </style>
</defs>
<rect width="1200" height="400" rx="26" fill="url(#bg)"/>
<circle cx="100" cy="380" r="260" fill="url(#g1)"/><circle cx="1150" cy="20" r="290" fill="url(#g2)"/>
<path d="M0 335C176 286 302 383 480 316C644 254 736 333 920 262C1024 222 1110 233 1200 196" stroke="#22D3EE" stroke-opacity=".09" stroke-width="2"/>
<path class="signal" d="M0 335C176 286 302 383 480 316C644 254 736 333 920 262C1024 222 1110 233 1200 196" stroke="url(#accent)" stroke-opacity=".32" stroke-width="2"/>

<g transform="translate(68 49)">
  <rect width="232" height="31" rx="15.5" fill="white" fill-opacity=".055" stroke="white" stroke-opacity=".1"/>
