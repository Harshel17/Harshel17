<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Harshel's engineering constellation</title>
<desc id="desc">A graphical map of four systems: OGym, ReserveGuard, Meridian, and Agent Economics.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070B"/><stop offset=".52" stop-color="#080C13"/><stop offset="1" stop-color="#07121B"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5EEAD4"/><stop offset=".48" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#E6FFFB"/><stop offset=".18" stop-color="#5EEAD4"/><stop offset=".5" stop-color="#0EA5E9" stop-opacity=".38"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="35"/></filter>
</defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/>
<circle cx="188" cy="88" r="120" fill="#14B8A6" opacity=".06" filter="url(#soft)"/>
<circle cx="1050" cy="590" r="150" fill="#8B5CF6" opacity=".07" filter="url(#soft)"/>
<g fill="#94A3B8" opacity=".18">
  <circle cx="70" cy="170" r="1.5"/><circle cx="1090" cy="116" r="1.5"/><circle cx="1010" cy="260" r="1"/><circle cx="150" cy="590" r="1"/><circle cx="910" cy="55" r="1"/>
</g>

<text x="56" y="63" fill="#5EEAD4" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="700" letter-spacing="3">ENGINEERING CONSTELLATION / 2026</text>
<text x="56" y="105" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="31" font-weight="650">Four systems. One operating instinct.</text>
<text x="56" y="134" fill="#7F8B9A" font-family="Inter,Segoe UI,Arial" font-size="14">Find the failure point · build the control · prove the outcome</text>

<!-- connection graph -->
<g fill="none" stroke-linecap="round">
  <path d="M305 275 C410 275 428 329 520 334" stroke="#1E5264" stroke-width="2"/>
  <path d="M895 275 C790 275 772 329 680 334" stroke="#263E70" stroke-width="2"/>
  <path d="M305 505 C410 505 434 385 520 360" stroke="#254D54" stroke-width="2"/>
  <path d="M895 505 C790 505 766 385 680 360" stroke="#403665" stroke-width="2"/>
  <path d="M340 275 C445 275 455 315 535 325" stroke="url(#line)" stroke-width="1.5" opacity=".7" stroke-dasharray="3 12"/>
  <path d="M860 505 C760 505 748 388 670 365" stroke="url(#line)" stroke-width="1.5" opacity=".7" stroke-dasharray="3 12"/>
</g>

<!-- center -->
<circle cx="600" cy="345" r="105" fill="url(#core)" opacity=".32"/>
<circle cx="600" cy="345" r="67" fill="#071018" stroke="url(#line)" stroke-width="1.5"/>
<circle cx="600" cy="345" r="51" fill="#091822" stroke="#5EEAD4" stroke-opacity=".22"/>
<path d="M578 361V329l22-13 22 13v32l-22 13z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
<circle cx="600" cy="345" r="7" fill="#5EEAD4" filter="url(#glow)"/>
<path d="M600 338V319M607 345h20M600 352v19M593 345h-20" stroke="#5EEAD4" stroke-width="1.5"/>
<text x="600" y="433" text-anchor="middle" fill="#F1F5F9" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700" letter-spacing="2">BUILD → CONTROL → MEASURE</text>

<!-- node helper cards -->
<!-- OGym -->
<g transform="translate(56 201)">
  <rect width="250" height="148" rx="22" fill="#0B1119" stroke="#22303C"/>
  <circle cx="46" cy="45" r="25" fill="#0E2425" stroke="#2DD4BF" stroke-opacity=".5"/>
  <g transform="translate(28 27)" stroke="#5EEAD4" stroke-width="2.3" stroke-linecap="round"><path d="M8 14v8M28 14v8M3 17v2M33 17v2M8 18h20"/><path d="M12 10c3-4 9-4 12 0" opacity=".65"/></g>
  <text x="82" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="650">OGym</text>
  <text x="82" y="60" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="10" letter-spacing="1.4">PRODUCT / CUSTOMERS</text>
  <text x="24" y="104" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial" font-size="13">From zero to paying gyms</text>
  <text x="24" y="128" fill="#5EEAD4" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">2 B2B · 50+ users · App Store</text>
</g>

<!-- ReserveGuard -->
<g transform="translate(894 201)">
  <rect width="250" height="148" rx="22" fill="#0B1119" stroke="#22303C"/>
  <circle cx="46" cy="45" r="25" fill="#10202A" stroke="#38BDF8" stroke-opacity=".5"/>
  <g transform="translate(28 27)" fill="none" stroke="#7DD3FC" stroke-width="2"><path d="M18 3l13 6v9c0 8-5 13-13 16C10 31 5 26 5 18V9z"/><path d="M12 18l4 4 8-9"/></g>
  <text x="82" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="650">ReserveGuard</text>
  <text x="82" y="60" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="10" letter-spacing="1.4">RECOVERY / APPROVALS</text>
  <text x="24" y="104" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial" font-size="13">Agents coordinate the save</text>
  <text x="24" y="128" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">13% risk → 86% on track</text>
</g>

<!-- Meridian -->
<g transform="translate(56 431)">
  <rect width="250" height="148" rx="22" fill="#0B1119" stroke="#22303C"/>
  <circle cx="46" cy="45" r="25" fill="#102329" stroke="#22D3EE" stroke-opacity=".5"/>
  <g transform="translate(28 27)" fill="none" stroke="#67E8F9" stroke-width="2"><circle cx="7" cy="18" r="4"/><circle cx="29" cy="8" r="4"/><circle cx="29" cy="28" r="4"/><path d="M11 16l14-6M11 20l14 6"/></g>
  <text x="82" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="18" font-weight="650">Meridian</text>
  <text x="82" y="60" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="10" letter-spacing="1.4">AGENTS / TELEMETRY</text>
  <text x="24" y="104" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial" font-size="13">Every step leaves evidence</text>
  <text x="24" y="128" fill="#67E8F9" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">7-step observable workflow</text>
</g>

<!-- Agent Economics -->
<g transform="translate(894 431)">
  <rect width="250" height="148" rx="22" fill="#0B1119" stroke="#22303C"/>
  <circle cx="46" cy="45" r="25" fill="#1B1830" stroke="#A78BFA" stroke-opacity=".55"/>
  <g transform="translate(28 27)" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"><path d="M5 29V19M14 29V13M23 29V7M32 29V3"/><path d="M4 9l8 4 9-7 11-3"/></g>
  <text x="82" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="650">Agent Economics</text>
  <text x="82" y="60" fill="#64748B" font-family="Inter,Segoe UI,Arial" font-size="10" letter-spacing="1.4">COST / OUTCOMES</text>
  <text x="24" y="104" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial" font-size="13">Measure what agents achieve</text>
  <text x="24" y="128" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="700">$0.72 / successful outcome</text>
</g>

<!-- footer legend -->
<g transform="translate(422 618)">
  <circle cx="0" cy="0" r="4" fill="#5EEAD4"/><text x="13" y="4" fill="#6B7786" font-family="Inter,Segoe UI,Arial" font-size="10" letter-spacing="1">REAL USERS</text>
  <circle cx="116" cy="0" r="4" fill="#38BDF8"/><text x="129" y="4" fill="#6B7786" font-family="Inter,Segoe UI,Arial" font-size="10" letter-spacing="1">CONTROLLED ACTIONS</text>
  <circle cx="289" cy="0" r="4" fill="#A78BFA"/><text x="302" y="4" fill="#6B7786" font-family="Inter,Segoe UI,Arial" font-size="10" letter-spacing="1">MEASURED VALUE</text>
</g>
</svg>